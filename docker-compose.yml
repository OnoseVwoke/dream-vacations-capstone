services:
  db:
    image: postgres:15-alpine
    container_name: dream-vacations-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - vacation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dream_vacation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dream-vacations-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vacation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://34.230.108.103.nip.io
    container_name: dream-vacations-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vacation-network

volumes:
  postgres_data:

networks:
  vacation-network:
    driver: bridge
